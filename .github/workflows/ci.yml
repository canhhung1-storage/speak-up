name: SpeakUp CI - Quality Gate

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # 1. BACKEND API VERIFICATION (NestJS + TypeORM)
  # ----------------------------------------------------------------------------
  backend-ci:
    name: Backend API Check (NestJS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install Dependencies
        run: |
          cd apps/api
          npm ci --prefer-offline --no-audit

      - name: Build Backend (TypeScript Compilation)
        run: |
          cd apps/api
          npm run build

  # ----------------------------------------------------------------------------
  # 2. FRONTEND WEB VERIFICATION (Angular 18 Standalone)
  # ----------------------------------------------------------------------------
  frontend-ci:
    name: Frontend Web Check (Angular 18)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Dependencies
        run: |
          cd apps/web
          npm ci --prefer-offline --no-audit

      - name: Code Quality & Lint Check (Angular ESLint)
        run: |
          cd apps/web
          npm run lint

      - name: Build Production Web Bundle
        run: |
          cd apps/web
          npm run build
