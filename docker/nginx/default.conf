# ==============================================================================
# 🌐 Nginx Reverse Proxy & API Gateway Configuration for SpeakUp
# ==============================================================================

upstream backend_api {
    server api:3000;
    keepalive 32;
}

upstream frontend_web {
    server web:4200;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    # Cho phép upload file ghi âm audio dung lượng lên tới 25MB
    client_max_body_size 25M;

    # Log định dạng chi tiết
    access_log /var/log/nginx/speakup_access.log;
    error_log /var/log/nginx/speakup_error.log warn;

    # Gzip nén dữ liệu giúp tải trang nhanh hơn
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # --------------------------------------------------------------------------
    # 1. Định tuyến API sang NestJS Backend
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend_api;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout cho các request xử lý audio/AI
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # --------------------------------------------------------------------------
    # 2. Định tuyến Giao diện & Live-reload sang Angular Web
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://frontend_web;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Hỗ trợ WebSocket Live Reload của Angular (ng serve)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
